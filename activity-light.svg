<svg xmlns="http://www.w3.org/2000/svg" width="760" height="196" viewBox="0 0 760 196" role="img">
  <style>
    .card  { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
    .accent{ fill: #2a78d6; }
    .t     { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #52514e; letter-spacing: 1.6px; }
    .v     { font: 600 58px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0b0b0b; text-anchor: middle; }
    .l     { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #52514e; text-anchor: middle; letter-spacing: .3px; }
    .f     { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #52514e; text-anchor: middle; }
    .r     { stroke: #e1e0d9; stroke-width: 1; }
  </style>
  <clipPath id="card"><rect x="0" y="0" width="760" height="196" rx="10" /></clipPath>
  <rect class="card" x="0.5" y="0.5" width="759" height="195" rx="10" />
  <rect class="accent" x="0" y="0" width="760" height="3" clip-path="url(#card)" />
  <text class="t" x="32" y="46">ENGINEERING ACTIVITY</text>
  <line class="r" x1="253.3" y1="72" x2="253.3" y2="158" /><line class="r" x1="506.7" y1="72" x2="506.7" y2="158" />
    <text class="v" x="126.7" y="126">380</text>
    <text class="l" x="126.7" y="152">PRs merged</text>
    <text class="v" x="380.0" y="126">175</text>
    <text class="l" x="380.0" y="152">Code reviews</text>
    <text class="v" x="633.3" y="126">7</text>
    <text class="l" x="633.3" y="152">Public repos</text>
  <text class="f" x="380" y="180">Public repositories only · recalculated weekly by GitHub Actions</text>
</svg>
