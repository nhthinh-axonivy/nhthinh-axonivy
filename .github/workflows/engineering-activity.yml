name: Engineering Activity

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recalculate engineering activity
        env:
          # The default GITHUB_TOKEN is scoped to this repository only, so
          # cross-repo `author:` / `reviewed-by:` searches silently return
          # almost nothing. A PAT with `repo` + `read:org` is required.
          # Create one and store it as the ACTIVITY_TOKEN repo secret.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/engineering-activity.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md activity-light.svg activity-dark.svg; then
            echo "No change in engineering activity."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md activity-light.svg activity-dark.svg
          git commit -m "chore: refresh engineering activity"
          git push
